<style>
:root{--bg:#f3f5fb;--sf:#fff;--sf2:#eef1f9;--tx:#141a33;--mu:#6a7394;--bd:#e0e5f2;--c1:#0ea5e9;--c2:#7c3aed;--c3:#ec4899;--c4:#10b981;--c5:#f59e0b;--sh:0 8px 30px rgba(60,80,180,.10)}
[data-theme=dark]{--bg:#070b1a;--sf:#0f1530;--sf2:#161d3f;--tx:#e8ecff;--mu:#8590bb;--bd:#222b55;--c1:#22d3ee;--c2:#a78bfa;--c3:#ff4fa3;--c4:#2ee6a0;--c5:#ffc23d;--sh:0 8px 30px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh;transition:background .3s}
h1,h2,h3,.logo,.kv{font-family:Sora,sans-serif}
aside{width:236px;background:linear-gradient(180deg,#2d5af0,#1a3db8);border-right:0;box-shadow:6px 0 30px rgba(30,64,200,.35);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{color:#fff;font-weight:700;font-size:20px;display:flex;gap:10px;align-items:center;padding:4px 8px 20px}
.logo i{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.nav{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:11px;border:0;background:none;color:rgba(255,255,255,.8);font:500 14px Inter;cursor:pointer;text-align:left;transition:.2s}
.nav i{width:20px;text-align:center}
.nav:hover{background:rgba(255,255,255,.15);color:#fff}
.nav.on{color:#1a3db8;font-weight:600;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25)}
main{flex:1;min-width:0;padding:22px 28px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:24px}.top p{color:var(--mu);font-size:13px;margin-top:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:10px 14px;border-radius:11px;font:600 13px Inter;cursor:pointer;display:inline-flex;gap:8px;align-items:center;transition:.2s}
.btn:hover{transform:translateY(-1px);border-color:var(--c1)}
.btn:focus-visible,.nav:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.btn.p{background:linear-gradient(120deg,var(--c2),var(--c1));color:#fff;border:0}
.btn.r{background:linear-gradient(120deg,var(--c3),var(--c5));color:#fff;border:0}
.btn.s{padding:6px 9px;font-size:12px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:var(--sh)}
.kpi{position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--a)}
.kpi .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--a);background:color-mix(in srgb,var(--a) 15%,transparent);font-size:18px;box-shadow:0 0 16px color-mix(in srgb,var(--a) 35%,transparent)}
.kv{font-size:24px;font-weight:700;margin-top:12px}.kl{color:var(--mu);font-size:13px}
.charts{grid-template-columns:2fr 1fr 1fr}
.card h3{font-size:14px;margin-bottom:12px}
.cv{position:relative;height:250px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:end}
.filters label,.fm label{font-size:11px;color:var(--mu);display:flex;flex-direction:column;gap:4px;font-weight:600}
input,select{background:var(--sf2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;font:14px Inter;min-width:130px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--mu);font-weight:600;padding:10px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--bd)}
tr:hover td{background:var(--sf2)}
.b{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b0{background:color-mix(in srgb,var(--c1) 18%,transparent);color:var(--c1)}.b1{background:color-mix(in srgb,var(--c5) 18%,transparent);color:var(--c5)}
.b2{background:color-mix(in srgb,var(--c4) 18%,transparent);color:var(--c4)}.b3{background:color-mix(in srgb,var(--c3) 18%,transparent);color:var(--c3)}
.tot{display:flex;gap:18px;margin-top:14px;font-weight:600;flex-wrap:wrap}.tot span{color:var(--mu);font-weight:400}
.empty{text-align:center;color:var(--mu);padding:36px}.th{width:44px;height:44px;object-fit:cover;border-radius:8px;display:block}.pv{max-height:140px;max-width:100%;border-radius:10px;margin-top:6px;object-fit:contain}.mp{border:1px dashed var(--bd);border-radius:12px;padding:10px;background:#eef1f9;margin-bottom:14px;color:#1e293b}
dialog{border:1px solid var(--bd);border-radius:18px;background:var(--sf);color:var(--tx);padding:24px;max-height:92vh;overflow:auto;width:min(520px,94vw);box-shadow:0 20px 70px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(5,8,25,.65);backdrop-filter:blur(4px)}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.fm input,.fm select{width:100%}
.fm .w{grid-column:1/-1}
.ft{display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;inset:auto 22px 22px auto;margin:0;border:0;background:var(--c2);color:#fff;padding:12px 18px;border-radius:12px;opacity:0;transform:translateY(12px);transition:.3s;pointer-events:none;z-index:9}
#toast.on{opacity:1;transform:none}
.st{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mu)}.st.ok{background:var(--c4);box-shadow:0 0 8px var(--c4)}
@media(max-width:900px){aside{width:64px;padding:14px 8px}.nav span,.logo span{display:none}.charts{grid-template-columns:1fr}main{padding:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<aside>
  <div class="logo"><i class="fa-solid fa-bolt"></i><span>CompuFAST</span></div>
  <button class="nav on" data-v="dash"><i class="fa-solid fa-chart-pie"></i><span>Dashboard</span></button>
  <button class="nav" data-v="soporte"><i class="fa-solid fa-headset"></i><span>Soporte técnico</span></button>

<main>
  <div class="top">

    </div>
  </div>
  <div id="v"></div>
</main>

<dialog id="dF"></dialog>
<dialog id="dS">
  <h2><i class="fa-solid fa-gear"></i> Configuración</h2>
  <p style="color:var(--mu);font-size:13px;margin:10px 0">Pega la URL de tu Apps Script publicado como aplicación web (ver Code.gs). Cada módulo se guarda en una hoja con su nombre.</p>
  <input id="su" style="width:100%" placeholder="https://script.google.com/macros/s/.../exec">
  <p style="color:var(--mu);font-size:13px;margin:16px 0 8px">Datos de contacto que aparecen en el banner del correo de cotización:</p>
  <div class="fm" style="margin:0"><label>Correo de ventas<input id="cm" type="email" placeholder="ventas@compufast.com"></label><label>Teléfono / WhatsApp<input id="ct" placeholder="55 1234 5678"></label></div>
  <div class="ft" style="margin-top:16px;flex-wrap:wrap">
    <button class="btn" onclick="pull()"><i class="fa-solid fa-cloud-arrow-down"></i> Traer de Sheets</button>
    <button class="btn" onclick="saveUrl();push(1)"><i class="fa-solid fa-cloud-arrow-up"></i> Enviar a Sheets</button>
    <button class="btn p" onclick="saveUrl();dS.close()">Guardar</button>
  </div>
</dialog>
<dialog id="dR">
  <h2><i class="fa-solid fa-file-pdf"></i> Reporte profesional en PDF</h2>
  <div class="fm">
    <label class="w">Módulo<select id="rm" onchange="repF()"></select></label>
    <label>Desde<input type="date" id="rd1"></label>
    <label>Hasta<input type="date" id="rd2"></label>
    <label class="w">Buscar texto<input id="rq" placeholder="Cliente, concepto, técnico..."></label>
    <div id="rx" class="w fm" style="margin:0"></div>
  </div>
  <div class="ft"><button class="btn" onclick="dR.close()">Cancelar</button><button class="btn r" onclick="genPDF()"><i class="fa-solid fa-download"></i> Generar PDF</button></div>
</dialog>
<dialog id="dM" style="width:min(640px,95vw)"></dialog>
<div id="toast" popover="manual"></div>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(+n||0);
const PR=['Baja','Media','Alta','Crítica'],ES=['Abierto','En proceso','Resuelto','Cerrado'];
const r2=n=>Math.round(n*100)/100,r1=n=>Math.round(n*10)/10,sin=(v,i)=>i==='No incluido'?+v:v/1.16;
const M={
 soporte:{t:'Soporte técnico',i:'headset',f:[{k:'fecha',l:'Fecha',t:'date'},{k:'cliente',l:'Cliente'},{k:'asunto',l:'Asunto'},{k:'tipo',l:'Tipo',t:'sel',o:['On-Site','Remoto']},{k:'cotizacion',l:'Cotización asignada',t:'sel',q:1,get o(){return ['No Aplica',...DB.cotizaciones.map(r=>r.numero).sort()]}},{k:'prioridad',l:'Prioridad',t:'sel',o:PR},{k:'estado',l:'Estado',t:'sel',o:ES},{k:'tecnico',l:'Técnico'},{k:'precio',l:'Precio unitario',t:'num',m:1,tl:'Ingresos soporte'},{k:'costo',l:'Costo unitario',t:'num',m:1,tl:'Costo total'},{k:'utilidad',l:'Ganancia',t:'num',m:1,tl:'Ganancia total',c:r=>r2(r.precio-r.costo)},{k:'margen',l:'% Ganancia',t:'num',p:1,c:r=>r.precio?r1((r.precio-r.costo)/r.precio*100):0}],b:r=>r.precio},
 cotizaciones:{t:'Cotizaciones',i:'file-invoice-dollar',f:[{k:'numero',l:'N.º',t:'auto'},{k:'fecha',l:'Fecha',t:'date'},{k:'cliente',l:'Cliente'},{k:'correo',l:'Correo del cliente',h:1},{k:'producto',l:'Producto'},{k:'imagen',l:'Imagen del producto',t:'img'},{k:'descripcion',l:'Descripción',h:1},{k:'monto',l:'Precio unitario',t:'num',m:1,tl:'Venta cotizada'},{k:'costo',l:'Costo unitario',t:'num',m:1,tl:'Costo total'},{k:'utilidad',l:'Ganancia',t:'num',m:1,tl:'Ganancia total',c:r=>Math.round((r.monto-r.costo)*100)/100},{k:'margen',l:'% Ganancia',t:'num',p:1,c:r=>r.monto?Math.round((r.monto-r.costo)/r.monto*1000)/10:0},{k:'link',l:'Link de compra (proveedor)',t:'url'},{k:'estado',l:'Estado',t:'sel',o:['Borrador','Enviada','Aprobada','Rechazada']}],b:r=>r.monto},
 ingresos:{t:'Ingresos',i:'sack-dollar',f:[{k:'fecha',l:'Fecha',t:'date'},{k:'concepto',l:'Concepto'},{k:'categoria',l:'Categoría',t:'sel',o:['Servicios','Productos','Suscripción','Otros']},{k:'metodo',l:'Método',t:'sel',o:['Transferencia','Efectivo','Tarjeta','Cheque']},{k:'monto',l:'Monto cobrado',t:'num',m:1,tl:'Total cobrado'},{k:'iva',l:'I.V.A. en el monto',t:'sel',o:['Incluido','No incluido']},{k:'neto',l:'Monto neto (sin I.V.A.)',t:'num',m:1,tl:'Monto neto sin I.V.A.',c:r=>r2(sin(r.monto,r.iva))},{k:'costo',l:'Costo',t:'num',m:1,tl:'Costo total'},{k:'utilidad',l:'Ganancia',t:'num',m:1,tl:'Ganancia total',c:r=>r2(r.neto-r.costo)},{k:'margen',l:'% Ganancia',t:'num',p:1,c:r=>r.neto?r1((r.neto-r.costo)/r.neto*100):0}],b:r=>r.neto},
 ventas:{t:'Ventas',i:'cart-shopping',f:[{k:'fecha',l:'Fecha',t:'date'},{k:'cliente',l:'Cliente'},{k:'producto',l:'Producto'},{k:'cantidad',l:'Cantidad',t:'num'},{k:'precio',l:'Precio unitario',t:'num',m:1,nt:1},{k:'iva',l:'I.V.A. en el precio',t:'sel',o:['Incluido','No incluido']},{k:'psin',l:'Precio sin I.V.A.',t:'num',m:1,nt:1,c:r=>r2(sin(r.precio,r.iva))},{k:'costo',l:'Costo unitario',t:'num',m:1,nt:1},{k:'total',l:'Total',t:'num',m:1,c:r=>r2(r.cantidad*r.precio)},{k:'utilidad',l:'Ganancia',t:'num',m:1,tl:'Ganancia total (sin I.V.A.)',c:r=>r2((r.psin-r.costo)*r.cantidad)},{k:'margen',l:'% Ganancia',t:'num',p:1,c:r=>r.psin?r1((r.psin-r.costo)/r.psin*100):0},{k:'pago',l:'Pago',t:'sel',o:['Pagado','Pendiente','Parcial','Cancelado']}],b:r=>r.psin*r.cantidad}
};
const heads=Object.fromEntries(Object.entries(M).map(([k,m])=>[k,['id',...m.f.map(x=>x.k)]]));
let DB=JSON.parse(localStorage.getItem('nx_db')||'null'),F={},cur='dash',charts=[],tm;
if(!DB){const d=n=>new Date(Date.now()-n*864e5).toISOString().slice(0,10),C=['Acme SA','Nova Tech','Grupo Delta','Luna Foods','Orbit MX'],A=Array.from({length:10},(_, i)=>i);
 DB={soporte:A.map(i=>({id:i+1,fecha:d(i*12),cliente:C[i%5],asunto:['Falla de red','Instalación de software','Impresora','Respaldo','Correo'][i%5],tipo:['On-Site','Remoto'][i%2],prioridad:PR[i%4],estado:ES[(i+1)%4],tecnico:['Ana','Luis'][i%2],precio:350+i*150,cotizacion:i%2?'No Aplica':'COT-'+String(i+1).padStart(4,'0'),costo:Math.round((350+i*150)*.5)})),
 cotizaciones:A.map(i=>({id:i+1,numero:'COT-'+String(i+1).padStart(4,'0'),fecha:d(i*14),cliente:C[i%5],correo:'',producto:['Cableado','Licencias','Servidor','Soporte anual','Equipo'][i%5],imagen:'',descripcion:['Cableado','Licencias','Servidor','Soporte anual','Equipo'][i%5],monto:8000+i*3200,costo:Math.round((8000+i*3200)*.72),utilidad:Math.round((8000+i*3200)*.28),margen:28,link:'',estado:['Borrador','Enviada','Aprobada','Rechazada'][(i+2)%4]})),
 ingresos:A.map(i=>({id:i+1,fecha:d(i*13),concepto:'Pago '+C[i%5],categoria:['Servicios','Productos','Suscripción','Otros'][i%4],metodo:['Transferencia','Efectivo','Tarjeta','Cheque'][i%4],monto:5000+i*2100,iva:'Incluido',costo:Math.round((5000+i*2100)*.45)})),
 ventas:A.map(i=>({id:i+1,fecha:d(i*11),cliente:C[i%5],producto:['Laptop','Router','Licencia','Switch','Monitor'][i%5],cantidad:1+i%4,precio:1800+i*350,iva:'Incluido',costo:Math.round((1800+i*350)*.55),total:(1+i%4)*(1800+i*350),pago:['Pagado','Pendiente','Parcial','Pagado'][i%4]}))}}
function nextNum(){const n=Math.max(0,...DB.cotizaciones.map(r=>parseInt(String(r.numero||'').replace(/\D/g,''))||0));return 'COT-'+String(n+1).padStart(4,'0')}
DB.cotizaciones.filter(r=>!r.numero).forEach(r=>r.numero=nextNum());
function recalc(){DB.cotizaciones.filter(r=>!r.numero).forEach(r=>r.numero=nextNum());
 Object.keys(M).forEach(k=>DB[k].forEach(r=>{M[k].f.forEach(x=>{if(x.c)return;if(x.t==='num')r[x.k]=+r[x.k]||0;else if(x.t==='sel'&&!r[x.k])r[x.k]=x.o[0];else if((x.t==='url'||x.t==='img')&&r[x.k]==null)r[x.k]=''});M[k].f.forEach(x=>{if(x.c)r[x.k]=x.c(r)})}))}
recalc();
const sum=(a,k)=>a.reduce((s,r)=>s+(+r[k]||0),0);
const url=()=>localStorage.getItem('nx_url')||'';
function toast(t){const e=$('#toast');e.textContent=t;try{e.showPopover()}catch(_){}e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>{e.classList.remove('on');setTimeout(()=>{try{e.hidePopover()}catch(_){}},300)},2600)}
function persist(){localStorage.setItem('nx_db',JSON.stringify(DB));clearTimeout(tm);if(url())tm=setTimeout(()=>push(),1500)}
function filt(k,f){return DB[k].filter(r=>(!f.d1||r.fecha>=f.d1)&&(!f.d2||r.fecha<=f.d2)&&(!f.q||M[k].f.filter(x=>x.t!=='img').map(x=>r[x.k]).join(' ').toLowerCase().includes(f.q.toLowerCase()))&&M[k].f.every(x=>x.t!=='sel'||!f[x.k]||r[x.k]===f[x.k])).sort((a,b)=>a.fecha<b.fecha?1:-1)}
const cell=(x,v)=>x.q?`<b>${esc(v||'No Aplica')}</b>`:x.p?`<b style="color:var(${v<0?'--c3':v<15?'--c5':'--c4'})">${(+v||0).toFixed(1)}%</b>`:x.t==='url'?(v?`<a href="${esc(/^https?:\/\//i.test(v)?v:'https://'+v)}" target="_blank" rel="noopener" style="color:var(--c1)" title="${esc(v)}"><i class="fa-solid fa-arrow-up-right-from-square"></i> Ver</a>`:'—'):x.t==='img'?(v?`<img class="th" src="${v}" alt="">`:'—'):x.t==='auto'?`<b>${esc(v)}</b>`:x.t==='sel'?`<span class="b b${x.o.indexOf(v)}">${esc(v)}</span>`:x.m?money(v):esc(v);

document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>go(b.dataset.v));

 if(v==='dash'){$('#ttl').textContent='Panel general';$('#sub').textContent='Resumen en tiempo real de tu operación';dash()}else table(v)}
/* ---- Dashboard ---- */
function dash(){
 const D=DB,ing=sum(D.ingresos,'monto'),vp=sum(D.ventas.filter(r=>r.pago==='Pagado'),'total'),pc=sum(D.ventas.filter(r=>r.pago==='Pendiente'||r.pago==='Parcial'),'total'),
 cq=sum(D.cotizaciones.filter(r=>r.estado==='Enviada'||r.estado==='Borrador'),'monto'),ta=D.soporte.filter(r=>r.estado==='Abierto'||r.estado==='En proceso').length,
 ap=D.cotizaciones.filter(r=>r.estado==='Aprobada').length,cv=D.cotizaciones.length?Math.round(ap/D.cotizaciones.length*100):0;
 const sp=sum(D.soporte.filter(r=>r.estado==='Resuelto'||r.estado==='Cerrado'),'precio'),qa=D.cotizaciones.filter(r=>r.estado!=='Rechazada'&&r.costo>0),mg=sum(qa,'monto')?Math.round(sum(qa,'utilidad')/sum(qa,'monto')*100):0;
 const gn=sum(D.ingresos,'utilidad')+sum(D.ventas.filter(r=>r.pago==='Pagado'),'utilidad')+sum(D.soporte.filter(r=>r.estado==='Resuelto'||r.estado==='Cerrado'),'utilidad');
